[project]
name = "streamtex-pack-manuals"
version = "0.2.1"
description = "Manual-authoring + training components on top of streamtex-pack-design (level badges, pitch heroes, FAQ, glossary, references, trainer profile, header/footer strips)."
readme = "README.md"
authors = [{ name = "Nicolas Guelfi" }]
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "streamtex>=0.7.7",
    "streamtex-pack-design>=0.3,<0.4",
]

[project.entry-points."streamtex.packs"]
streamtex-pack-manuals = "streamtex_manuals"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamtex_manuals*"]

[tool.setuptools.package-data]
streamtex_manuals = [
    "_pack_manifest.toml",
    "kits/*.toml",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F403", "F405", "E701", "E741"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "streamtex[cli]>=0.7.7",
]
