[project]
name = "streamtex-pack-gse"
version = "2.0.1"
description = "Pack for the AI4SE / GSE training family (manifest 0.2): GSE-One design system + transition_gse + gse_letter + canonical palette JSON + AI prompt artifacts (prefix+suffixes)."
readme = "README.md"
authors = [{ name = "Nicolas Guelfi" }]
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "streamtex>=0.7.17",
    "streamtex-pack-design>=0.3,<0.4",
]

[project.entry-points."streamtex.packs"]
streamtex-pack-gse = "streamtex_gse"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["streamtex_gse*"]

[tool.setuptools.package-data]
streamtex_gse = [
    "_pack_manifest.toml",
    "kits/*.toml",
    "palettes/*.json",
    "ai_prompts/**/*.txt",
    "archetypes/*.md",
    "guidelines/*.md",
    "skills/*.md",
    "agents/*.md",
    "integrations/**/*",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["F403", "F405", "E701", "E741"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "streamtex[cli]>=0.7.7",
]
