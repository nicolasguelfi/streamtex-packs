# Per-pack CI — runs ruff + pytest on each pack whose files changed.
#
# Path filters: a job for a pack only runs if that pack's files
# (or the workflow itself, or root config) changed in the push/PR.
# This keeps CI fast and parallelizable.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_NO_SOURCES: 1

jobs:
  pack-design:
    name: streamtex-pack-design
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamtex-pack-design
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes affecting streamtex-pack-design
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - 'streamtex-pack-design/**'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync

      - name: Ruff
        if: steps.changes.outputs.run == 'true'
        run: uv run ruff check streamtex_design/ tests/

      - name: Pytest
        if: steps.changes.outputs.run == 'true'
        run: uv run pytest tests/ -v

  pack-manuals:
    name: streamtex-pack-manuals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamtex-pack-manuals
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes affecting streamtex-pack-manuals
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - 'streamtex-pack-manuals/**'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3

      # The pack requires streamtex-pack-design by name (streamtex-packs#2): it
      # is not on PyPI, so it is installed from the sibling folder.
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          uv venv --python 3.12
          uv pip install -e ../streamtex-pack-design -e . "pytest>=8.0" "ruff>=0.5" "streamtex[cli]>=0.7.17"

      - name: Ruff
        if: steps.changes.outputs.run == 'true'
        run: uv run --no-sync ruff check streamtex_manuals/

  pack-gse:
    name: streamtex-pack-gse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamtex-pack-gse
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes affecting streamtex-pack-gse
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - 'streamtex-pack-gse/**'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3

      # The pack requires streamtex-pack-design by name (streamtex-packs#2): it
      # is not on PyPI, so it is installed from the sibling folder.
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          uv venv --python 3.12
          uv pip install -e ../streamtex-pack-design -e . "pytest>=8.0" "ruff>=0.5" "streamtex[cli]>=0.7.17"

      - name: Ruff
        if: steps.changes.outputs.run == 'true'
        run: uv run --no-sync ruff check streamtex_gse/ tests/

      - name: Pytest
        if: steps.changes.outputs.run == 'true'
        run: uv run --no-sync pytest tests/ -v

  templates:
    name: CLI templates lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the templates name pack tags

      - name: Detect changes affecting the packs or the templates
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - 'streamtex-pack-*/**'
              - 'tools/check_templates.py'
              - '.github/workflows/ci.yml'

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v3

      # A project made from each template must lock, the stx way (git sources)
      # and the Docker way (direct URLs, --no-sources) — streamtex-packs#2.
      - name: Lock a project made from each template
        if: steps.changes.outputs.run == 'true'
        run: uv run --no-project -p 3.12 python tools/check_templates.py
